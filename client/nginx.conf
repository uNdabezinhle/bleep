server {
    listen 80;
    server_name _;
    client_max_body_size 12m;
    root /usr/share/nginx/html;
    index index.html;

    location /v1/wake {
        proxy_pass http://relay:8000/v1/wake;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_read_timeout 3600s;
    }

    location /v1/ {
        proxy_pass http://relay:8000/v1/;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 120s;
    }

    location = /download/bleep.apk {
        alias /usr/share/nginx/html/download/bleep.apk;
        default_type application/vnd.android.package-archive;
        add_header Content-Disposition 'attachment; filename="bleep.apk"';
        add_header X-Content-Type-Options nosniff;
    }

    location /download/ {
        alias /usr/share/nginx/html/download/;
        index index.html;
        add_header X-Content-Type-Options nosniff;
    }

    location = /hashes.html {
        root /usr/share/nginx/html;
        try_files /download/hashes.html /hashes.html =404;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    add_header X-Content-Type-Options nosniff;
    add_header Referrer-Policy no-referrer;
    add_header X-Frame-Options DENY;
}
